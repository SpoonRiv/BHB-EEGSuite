app:
  ui_version: "3.5.1"

ui:
  waveform:
    # 前端显示窗口时长（秒）。仅影响展示，不影响采集与离线存储。
    time_window_sec: 2.0
    # 前端波形渲染刷新频率（Hz）。仅影响展示，不影响采集与离线存储。
    render_fps_hz: 15
    # 单通道最大渲染点数（超过则进行降采样渲染，确保不丢数据但降低渲染负载）。
    max_render_points_per_channel: 800
    # 是否所有通道共用同一 y 轴范围（true=统一缩放，false=各通道独立）。
    global_scale: false
    # 前端 WS 待处理队列上限（只用于展示背压：积压时覆盖旧包以保持“尽量实时”的显示）。 
    max_pending_ws_chunks: 2
    # 动态 y 轴“分档”步长（<=0 表示不分档，连续变化）。单位与波形数值一致（通常为 uV 或计数）。
    y_axis_step: 100
    # 动态 y 轴更新频率（Hz）。降低该值可减少 yAxis 重算/重绘开销。
    y_axis_update_hz: 5
    # EEG 波形 y 轴是否动态变化（true=动态缩放；false=固定缩放，最大值由滑条控制）。
    y_axis_dynamic_default: true
    # 固定缩放模式下的 y 轴最大值默认值（显示范围为 [-max, +max]）。
    y_axis_fixed_max_default: 500
    # 固定缩放模式下滑条最小/最大/步进。
    y_axis_fixed_max_min: 200
    y_axis_fixed_max_max: 5000
    y_axis_fixed_max_step: 100

bluetooth:
  device_names:
    - "MSM"
    - "MSM_C16"
    - "BLE"
  target_device: "MSM"
  module_name_regex: "MSM(?P<eeg_channels>\\d{3})S(?P<stim_channels>\\d{2})"
  mac_address: ""  # 可选：直接指定 MAC；为空则按名称扫描
  scan:
    max_retries: 10
    retry_interval_sec: 1.0
  gatt:
    # notify 与 write 的特征值（可以使用 handle 或 uuid；默认取旧版脚本的 handle）
    notify_char_uuid: "0xFFF1"
    notify_char_handle: 5
    write_char_uuid: "0xFFF2"
    write_char_handle: 8
    # V2.4 稳定链路使用 Write With Response；确保 START/STOP 已被设备确认后再切换状态。
    write_with_response: true
  commands:
    init: []
    start_eeg: [0x02, 0x01]
    stop_eeg: [0x02, 0x02]
    start_impedance: [0x03, 0x01]
    stop_impedance: [0x03, 0x02]
    start_tdcs: [0x07, 0x01]
    stop_tdcs: [0x07, 0x02]
    trigger_source_ble: [0x06, 0x01]
    trigger_source_ttl_uart: [0x06, 0x02]
    trigger_source_ttl_level: [0x06, 0x03]
    trigger_set: [0xFF, 0x01]
    trigger_clear: [0xFF, 0x02]

eeg:
  # 预留 8/16 通道版本切换接口：8 或 16
  n_channels: 8
  # UI 中允许编辑电极组合的通道模式（不代表采集链路已支持）
  selectable_channel_modes: [8, 16]
  # 已完成采集链路并允许应用到系统的通道模式（8/16 均走 BLE）
  supported_channel_modes: [8, 16]
  sampling_rate_hz: 500
  channel_names:
    - "P3"
    - "P7"
    - "PO7"
    - "PO3"
    - "PO4"
    - "PO8"
    - "P8"
    - "P4"
  ref_channel_name: "Pz"
  # 参考电极可选列表（用于 UI 单独下拉选择；不参与“通道选择满 n 个”的计数）
  ref_selectable_channels: ["Fz", "Cz", "Pz", "CPz"]
  # 10-20 系统可选电极列表（用于 UI 地形图按钮与通道组合校验）
  montage_1020_channels:
    - "Fp1"
    - "Fpz"
    - "Fp2"
    - "AF7"
    - "AF3"
    - "AF4"
    - "AF8"
    - "F7"
    - "F5"
    - "F3"
    - "F1"
    - "Fz"
    - "F2"
    - "F4"
    - "F6"
    - "F8"
    - "FT9"
    - "FT7"
    - "FC5"
    - "FC3"
    - "FC1"
    - "FCz"
    - "FC2"
    - "FC4"
    - "FC6"
    - "FT8"
    - "FT10"
    - "T7"
    - "C5"
    - "C3"
    - "C1"
    - "Cz"
    - "C2"
    - "C4"
    - "C6"
    - "T8"
    - "TP9"
    - "TP7"
    - "CP5"
    - "CP3"
    - "CP1"
    - "CPz"
    - "CP2"
    - "CP4"
    - "CP6"
    - "TP8"
    - "TP10"
    - "P7"
    - "P5"
    - "P3"
    - "P1"
    - "Pz"
    - "P2"
    - "P4"
    - "P6"
    - "P8"
    - "PO7"
    - "PO3"
    - "POz"
    - "PO4"
    - "PO8"
    - "O1"
    - "Oz"
    - "O2"
  # 10-20 电极位置布局文件（用于 UI 绘制电极地形图）
  montage_1020_layout_path: "configs/electrodes/standard_1020_layout.json"
  # 常用通道组合（仅用于下发给 UI 的默认预设；本机自定义预设请保存到 config.local.yaml）
  presets:
    - name: "BHB-脑电头环组合"
      n_channels: 8
      channel_names: ["P3", "P7", "PO7", "PO3", "PO4", "PO8", "P8", "P4"]
      ref_channel_name: "Pz"
    - name: "BHB-脑电帽组合"
      n_channels: 16
      channel_names: ["Fp1", "Fp2", "F3", "Fz", "F4", "T7", "C3", "Cz", "C4", "T8", "P3", "Pz", "P4", "O1", "Oz", "O2"]
      ref_channel_name: "CPz"
  lsl:
    stream_name: "BHB-EEG"
    stream_type: "EEG"
    include_trigger_channel: true
  protocol:
    ch8:
      frame:
        # 8通道协议参数（根据 docs/CH8底层FPGA操作指令及帧格式V1.2.docx，总长 140 bytes）
        header_len_bytes: 3    # 帧头 2 字节 (0xAA 0xBB) + 帧序号 1 字节
        bytes_per_sample_per_channel: 3
        samples_per_frame: 5
        trigger_len_bytes: 1
        imu_len_bytes: 12
        battery_len_bytes: 2
        tail_len_bytes: 2      # 校验段 1 字节 (SUM) + 帧尾 1 字节 (0xCC)
      conversion:
        # Vin = raw_signed * 2 * Vref / (ADC增益 * G * 2^位宽)
        vref_volts: 4.5
        adc_gain: 24.0
        frontend_gain_g: 4.985
        resolution_bits: 24
    ch16:
      frame:
        # 16通道协议参数（参考 docs/16CH底层FPGA操作指令及帧格式V1.0.docx，总长 246 bytes）
        header_len_bytes: 3    # 帧头 2 字节 (0xAA 0xBB) + 帧序号 1 字节
        bytes_per_sample_per_channel: 3
        samples_per_frame: 5
        trigger_len_bytes: 1
        imu_len_bytes: 0       # 16CH EEG 帧不包含 IMU
        battery_len_bytes: 0   # 16CH EEG 帧不包含电量段
        tail_len_bytes: 2      # 校验段 1 字节 (SUM) + 帧尾 1 字节 (0xCC)

impedance:
  enabled: true
  # n_channels 不填时默认跟随 eeg.n_channels（8/16 自动切换）
  frame:
    header: [0x55, 0x66]
    frame_len_bytes_ch8: 46
    frame_len_bytes_ch16: 74
    include_bias: true
    include_tdcs_if_ch8: true
    gain_scale: 10000.0
  lsl:
    stream_name: "BHB-IMP"
    stream_type: "Impedance"
    sampling_rate_hz: 0
  streaming:
    buffer_size: 5
  ui:
    refresh_hz: 1
    good_max_ohm: 5000
    warn_max_ohm: 20000
    slider_max_ohm: 30000
    slider_step_ohm: 100

tdcs:
  enabled: true
  supported_channel_modes: [8]
  ui:
    show_reserved: true

trigger:
  enabled: true
  host: "127.0.0.1"
  port: 8002
  timeout_sec: 1.0
  source_mode: "ble"

server:
  host: "127.0.0.1"
  port: 8001

streaming:
  # 后端 WebSocket 转发到前端的发送频率（Hz），用于节流，降低前端收包与解析负载
  ws_send_fps_hz: 15
  # 每次推送的采样点数；若为 0，则自动按 sampling_rate_hz / ws_send_fps_hz 计算
  buffer_size: 0
  # WebSocket 广播队列：满时合并旧 chunk（扩大单次 payload），避免积压且不丢数据
  ws_queue_max_chunks: 5
  # 单个 WebSocket 发送超时（秒），避免慢连接拖垮整体
  ws_send_timeout_sec: 0.5
  # LSL 解析等待与重试（用于处理“先启动采集、LSL 流稍后才出现”的情况）
  lsl_resolve_timeout_sec: 1.0
  lsl_resolve_retry_interval_sec: 0.5

debug:
  # 上位机调试界面：仅展示调试事件（如收到EEG长度、发送/接收指令等），不展示网络/蓝牙连接信息
  ui_enabled: true
  max_events: 500

signal:
  notch:
    freq_hz: 50.0
    quality_factor: 30.0
  bandpass:
    enabled: true
    lowcut_hz: 1.0
    highcut_hz: 45.0
    order: 4
  psd:
    enabled: true
    # 使用最近 4 秒数据估计 Welch PSD；界面每秒更新一次。
    window_sec: 4.0
    update_hz: 1.0
    nfft: 512
    fmin_hz: 1.0
    fmax_hz: 45.0
    to_db: true
    apply_notch: true
    car_enabled: true
    band_filter_order: 4
    variance_window_sec: 0.5
    variance_step_sec: 0.1
    variance_floor_uv2: 1.0e-12
    quality:
      automatic_enabled: true
      manual_enabled: true
      bad_channels: []
      lowcut_hz: 0.5
      highcut_hz: 45.0
      filter_order: 4
      window_sec: 0.5
      step_sec: 0.1
      relative_energy_ratio: 8.0
      absolute_energy_threshold_uv2: 2500.0
      exclude_windows: 3
      recovery_windows: 10
      min_valid_channels: 3
    bands:
      - {key: delta, name: Delta, symbol: "", fmin_hz: 1.0, fmax_hz: 4.0}
      - {key: theta, name: Theta, symbol: "", fmin_hz: 4.0, fmax_hz: 8.0}
      - {key: alpha, name: Alpha, symbol: "", fmin_hz: 8.0, fmax_hz: 13.0}
      - {key: beta, name: Beta, symbol: "", fmin_hz: 13.0, fmax_hz: 30.0}
      - {key: gamma, name: Gamma, symbol: "", fmin_hz: 30.0, fmax_hz: 45.0}

offline:
  root_dir: "offlinedata"
  # 离线写入队列上限（按 chunk 计数）。用于限制内存积压；满时行为由 writer_queue_full_policy 决定。
  writer_queue_max_chunks: 50
  # 离线写入队列满时策略：merge=合并旧 chunk（尽量不丢样本）；drop_oldest=丢最旧；drop_newest=丢最新。
  writer_queue_full_policy: "merge"
  export:
    physical_unit: "uV"
    # 未配置协议换算参数时的兼容回退值；8通道使用 eeg.protocol.ch8.conversion 动态计算。
    count_divisor: 120.0
    trigger_label: "TRIG"
  filter:
    order: 4
    lowcut_hz_default: 0.5
    highcut_hz_default: 80.0
