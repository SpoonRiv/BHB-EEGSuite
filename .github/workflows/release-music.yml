name: Release Windows base and music extension

on:
  push:
    tags:
      - "base-V*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: BHB
          auto-activate-base: false
      - name: Install packager
        shell: pwsh
        run: conda run -n BHB python -m pip install pyinstaller==6.16.0
      - name: Build release assets
        shell: pwsh
        run: conda run -n BHB python tools/build_windows.py --asset-base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $music = (Get-ChildItem -Path dist -Filter 'BHB-EEGSuite-music-*.zip' -File).FullName
          $assets = @('dist/modules.json', 'dist/BHB-EEGSuite-base.zip') + $music
          gh release create $env:GITHUB_REF_NAME @assets --title "BHB EEGSuite $env:GITHUB_REF_NAME" --notes "Download BHB-EEGSuite-base.zip to run on Windows. The music extension is optional and can be installed from within the app."
