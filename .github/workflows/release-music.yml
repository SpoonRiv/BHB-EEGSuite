name: Release music extension

on:
  push:
    tags:
      - "music-V*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check tag matches module version
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("extensions/music/manifest.json", encoding="utf-8"))["version"])')
          test "$GITHUB_REF_NAME" = "music-$version"
      - name: Build release assets
        run: python tools/build_modules.py --asset-base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/modules.json \
            dist/BHB-EEGSuite-music-*.zip \
            dist/BHB-EEGSuite-base.zip \
            --title "Music extension ${GITHUB_REF_NAME#music-}" \
            --notes "BHB EEGSuite base package and separately downloadable music extension."
